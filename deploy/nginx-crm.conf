# nginx für CRM und Kundenportal
# Kopieren nach /etc/nginx/sites-available/vonnebrink-crm, dann:
#   ln -s /etc/nginx/sites-available/vonnebrink-crm /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Beide Adressen gehen an dieselbe App (127.0.0.1:3000).
# portal.vonnebrink.com zeigt Kunden nur Portal und öffentliche Mail-Links.

upstream vonnebrink_crm {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.vonnebrink.com portal.vonnebrink.com;
    return 301 https://$host$request_uri;
}

# ---------------- CRM (Mitarbeiter) ----------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.vonnebrink.com;

    ssl_certificate     /etc/ssl/vonnebrink/fullchain.pem;
    ssl_certificate_key /etc/ssl/vonnebrink/privkey.pem;

    # wie MAX_UPLOAD_SIZE_MB in der .env (+ etwas Luft)
    client_max_body_size 110M;

    location = / { return 302 /crm; }

    location / {
        proxy_pass http://vonnebrink_crm;
        include /etc/nginx/snippets/vonnebrink-proxy.conf;
    }
}

# ---------------- Kundenportal ----------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.vonnebrink.com;

    ssl_certificate     /etc/ssl/vonnebrink/fullchain.pem;
    ssl_certificate_key /etc/ssl/vonnebrink/privkey.pem;

    client_max_body_size 110M;

    location = / { return 302 /portal; }

    # Das CRM gibt es hier nicht
    location ^~ /crm { return 404; }

    location / {
        proxy_pass http://vonnebrink_crm;
        include /etc/nginx/snippets/vonnebrink-proxy.conf;
    }
}
